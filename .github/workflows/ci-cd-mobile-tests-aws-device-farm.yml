name: ☁️🚀 Mobile Tests - AWS Device Farm

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run in AWS Device Farm
        required: true
        default: android
        type: choice
        options:
          - android
          - ios

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  AWS_REGION: 'us-east-1'

jobs:
  # ============================================================
  # Sanity tests: corren en ubuntu en push/PR, sin dispositivo
  # ============================================================
  sanity-tests:
    name: Sanity Tests (framework health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Corre siempre: push, PR y workflow_dispatch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Sanity Tests (no device required)
        run: mvn test -Drun.mobile.tests=false -B

      - name: Upload Sanity Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-aws
          path: |
            target/allure-results/
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 14

  # ============================================================
  # Mobile tests: solo corren con dispatch manual en AWS
  # ============================================================
  mobile-tests-aws-device-farm:
    name: Mobile Tests - aws-device-farm-${{ github.event.inputs.platform }}
    needs: [ sanity-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && needs['sanity-tests'].result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Run Mobile Tests - AWS Device Farm
        shell: bash
        env:
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
        run: mvn test -Drun.mobile.tests=true -Denv=aws-device-farm -Dplatform=${TEST_PLATFORM} -B

      - name: Upload AWS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-aws-device-farm-${{ github.event.inputs.platform }}
          path: |
            target/allure-results/
            target/cucumber-reports/
            target/surefire-reports/
            target/videos/
            target/screenshots/
          retention-days: 30

      - name: Report guidance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AWS Device Farm - Reportes"
            echo "- Fuente principal recomendada: AWS Device Farm (videos, logs, screenshots por dispositivo)."
            echo "- Respaldo en GitHub: artifact mobile-test-results-aws-device-farm-${{ github.event.inputs.platform }}."
            echo "- Retencion recomendada: 14-30 dias en GitHub artifacts y 90+ dias en S3 (si aplica cumplimiento/auditoria)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Publish Allure Report to GitHub Pages
  # ============================================================
  publish-report:
    name: Publish Allure Report to GitHub Pages
    needs: [ mobile-tests-aws-device-farm ]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch' && needs['mobile-tests-aws-device-farm'].result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Mobile Test Results
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-results-aws-device-farm-${{ github.event.inputs.platform }}
          path: allure-results

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure HTML Report
        run: |
          allure generate allure-results/allure-results --clean -o allure-report
          echo "✅ Allure report generated"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore: update Allure report - AWS ${{ github.event.inputs.platform }} run #${{ github.run_number }}"

      - name: Report URL summary
        run: |
          echo "## 📊 Allure Report Published" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          echo "🏃 **Run:** #${{ github.run_number }} - AWS ${{ github.event.inputs.platform }}" >> $GITHUB_STEP_SUMMARY

