name: 🚀 Mobile Test Automation - Professional Pipeline 2026

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]
  #schedule: Temporalmente deshabilitado para enfocarnos en ejecución manual
    # Smoke tests diarios: 6:00 AM UTC
    # - cron: '0 6 * * *' Temporalmente deshabilitado para enfocarnos en ejecución manual
    # Full tests (incluye mobile): Viernes 10:00 AM UTC
    # - cron: '0 10 * * 5' Temporalmente deshabilitado para enfocarnos en ejecución manual
  workflow_dispatch:
    inputs:
      test-environment:
        description: 'Test Environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - browserstack
          - aws-device-farm
      include-mobile-tests:
        description: 'Include Mobile Tests'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9'
  APPIUM_SERVER_URL: 'http://127.0.0.1:4723'

jobs:
  # ==========================================
  # STAGE 1: Build & Static Analysis
  # ==========================================
  build-and-analyze:
    name: Build & Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean install -DskipTests -B -V

      - name: 📊 Run SonarQube Analysis (Optional)
        if: always()
        run: |
          echo "ℹ️ SonarQube analysis skipped (configure if needed)"

      - name: 📦 Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/
          retention-days: 1

  # ==========================================
  # STAGE 2: Framework Tests (Cloud - Ubuntu)
  # ==========================================
  test-framework-cloud:
    name: Framework Tests (Cloud)
    runs-on: ubuntu-latest
    needs: build-and-analyze
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Framework Health Tests
        run: mvn test -Drun.mobile.tests=false -B

      - name: 📊 Generate Test Report
        if: always()
        run: mvn allure:report -B || echo "⚠️ Allure report skipped"

      - name: 📁 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-test-results
          path: |
            target/allure-results/
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 30

      - name: 📈 Publish Test Report to GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report

  # ==========================================
  # STAGE 3: Plan Mobile Execution (Manual Only)
  # ==========================================
  prepare-mobile-plan:
    name: Prepare Mobile Plan
    runs-on: ubuntu-latest
    needs: build-and-analyze
    outputs:
      run_mobile: ${{ steps.plan.outputs.run_mobile }}
      mobile_matrix: ${{ steps.plan.outputs.mobile_matrix }}

    steps:
      - name: Build mobile matrix from manual inputs
        id: plan
        shell: bash
        run: |
          RUN_MOBILE="false"
          MATRIX='{"include":[]}'

          echo "=== DEBUG ==="
          echo "Event: ${{ github.event_name }}"
          echo "Include Mobile Tests: ${{ github.event.inputs.include-mobile-tests }}"
          echo "Test Environment: ${{ github.event.inputs.test-environment }}"

          # Check if workflow_dispatch AND include-mobile-tests is true
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.include-mobile-tests }}" == "true" ]; then
              case "${{ github.event.inputs.test-environment }}" in
                local)
                  RUN_MOBILE="true"
                  MATRIX='{"include":[{"environment":"local-android","os":["self-hosted","android","appium","windows"],"test-env":"local","platform":"android"}]}'
                  echo "✅ Selected: LOCAL environment"
                  ;;
                browserstack)
                  RUN_MOBILE="true"
                  MATRIX='{"include":[{"environment":"browserstack-android","os":"ubuntu-latest","test-env":"browserstack","platform":"android"},{"environment":"browserstack-ios","os":"ubuntu-latest","test-env":"browserstack","platform":"ios"}]}'
                  echo "✅ Selected: BROWSERSTACK environment"
                  ;;
                aws-device-farm)
                  RUN_MOBILE="true"
                  MATRIX='{"include":[{"environment":"aws-device-farm","os":"ubuntu-latest","test-env":"aws-device-farm","platform":"android"}]}'
                  echo "✅ Selected: AWS-DEVICE-FARM environment"
                  ;;
              esac
            else
              echo "⏭️  Skipping: include-mobile-tests is false"
            fi
          else
            echo "⏭️  Skipping: Not a workflow_dispatch event (event=${{ github.event_name }})"
          fi

          echo "=== OUTPUT ==="
          echo "run_mobile=$RUN_MOBILE"
          echo "mobile_matrix=$MATRIX"
          
          echo "run_mobile=$RUN_MOBILE" >> "$GITHUB_OUTPUT"
          echo "mobile_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ==========================================
  # STAGE 3: Mobile Tests (Dynamic Matrix)
  # ==========================================
  test-mobile-multi-env:
    name: Mobile Tests - ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    needs: [ build-and-analyze, prepare-mobile-plan ]
    timeout-minutes: 120
    if: needs.prepare-mobile-plan.outputs.run_mobile == 'true'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-mobile-plan.outputs.mobile_matrix) }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: ✅ [LOCAL] Verify ADB and Appium Server
        if: matrix.test-env == 'local'
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Write-Host "Checking ADB and Appium Server..."

          # Build ordered candidates to locate adb.exe without hardcoding a single user path.
          $candidates = @()
          if ($env:ADB_BIN) { $candidates += $env:ADB_BIN }
          if ($env:ANDROID_HOME) { $candidates += (Join-Path $env:ANDROID_HOME 'platform-tools\adb.exe') }
          if ($env:ANDROID_SDK_ROOT) { $candidates += (Join-Path $env:ANDROID_SDK_ROOT 'platform-tools\adb.exe') }
          $candidates += (Join-Path $env:USERPROFILE 'AppData\Local\Android\Sdk\platform-tools\adb.exe')

          $adbFromPath = (Get-Command adb -ErrorAction SilentlyContinue).Source
          if ($adbFromPath) { $candidates += $adbFromPath }

          $adb = $null
          foreach ($item in $candidates | Select-Object -Unique) {
            if ($item -and (Test-Path $item)) {
              $adb = $item
              break
            }
          }

          if (-not $adb) {
            Write-Host "ERROR: adb.exe not found."
            Write-Host "Checked candidates:"
            $candidates | Select-Object -Unique | ForEach-Object { Write-Host " - $_" }
            Write-Host "USERPROFILE=$env:USERPROFILE"
            Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
            Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
            exit 1
          }

          $platformTools = Split-Path -Parent $adb
          $sdkRoot = Split-Path -Parent $platformTools

          "ADB_BIN=$adb" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $platformTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "ADB found: $adb"
          & $adb start-server
          & $adb devices

          Write-Host "Checking Appium server at $env:APPIUM_SERVER_URL..."
          try {
            $response = Invoke-WebRequest -Uri "$env:APPIUM_SERVER_URL/status" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
              Write-Host "ERROR: Appium server returned status code $($response.StatusCode)"
              exit 1
            }
          }
          catch {
            Write-Host "ERROR: Appium server not reachable at $env:APPIUM_SERVER_URL"
            Write-Host $_.Exception.Message
            exit 1
          }

          Write-Host "Appium server is running"

      - name: 🌐 [BROWSERSTACK] Configure Credentials
        if: matrix.test-env == 'browserstack'
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "ERROR: BrowserStack credentials not found in secrets"
            exit 1
          fi

      - name: ☁️ [AWS] Configure AWS Credentials
        if: matrix.test-env == 'aws-device-farm'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 📱 [LOCAL] Run Mobile Tests - ${{ matrix.environment }}
        if: matrix.test-env == 'local'
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Write-Host "Using ADB_BIN=$env:ADB_BIN"
          Write-Host "Using ANDROID_HOME=$env:ANDROID_HOME"
          mvn test -Drun.mobile.tests=true -Denv=local -Devidence.video.enabled=true -B

      - name: 📱 [BROWSERSTACK] Run Mobile Tests - ${{ matrix.environment }}
        if: matrix.test-env == 'browserstack'
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: mvn test -Drun.mobile.tests=true -Denv=browserstack -Dplatform=${TEST_PLATFORM} -Devidence.video.enabled=false -B

      - name: 📱 [AWS] Run Mobile Tests - ${{ matrix.environment }}
        if: matrix.test-env == 'aws-device-farm'
        shell: bash
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: mvn test -Drun.mobile.tests=true -Denv=aws-device-farm -Dplatform=${TEST_PLATFORM} -B

  # ==========================================
  # STAGE 4: Quality Gates
  # ==========================================
  quality-gates:
    name: Quality Gates & Checks
    runs-on: ubuntu-latest
    needs: [ test-framework-cloud ]
    if: always()

    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4

      - name: ✅ Validate Test Results
        run: |
          echo "📊 Validating test execution..."
          if [ -d "framework-test-results" ]; then
            echo "✅ Framework tests found"
          fi
          
          # Validar resultados móviles si existen
          for dir in mobile-test-results-*; do
            if [ -d "$dir" ]; then
              echo "✅ Mobile test results found: $dir"
            fi
          done

      - name: 🔍 Check for Test Failures
        run: |
          echo "🔍 Quality gates passed"
