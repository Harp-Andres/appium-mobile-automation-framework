name: 🖥️🤖 Mobile Tests - Self Hosted

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9'
  APPIUM_SERVER_URL: 'http://127.0.0.1:4723'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Sanity tests: corren siempre primero (push/PR y manual)
  # ============================================================
  sanity-tests:
    name: Sanity Tests (framework health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Corre siempre: push, PR y workflow_dispatch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Sanity Tests (no device required)
        run: mvn test -Drun.mobile.tests=false -B

      - name: Upload Sanity Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results
          path: |
            target/allure-results/
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 14

  # ============================================================
  # Mobile tests: solo manual y solo si sanity fue exitoso
  # ============================================================
  mobile-tests-local-android:
    name: Mobile Tests - local-android
    needs: [ sanity-tests ]
    runs-on: [self-hosted, android, appium, windows]
    timeout-minutes: 120
    # Solo corre cuando se dispara manualmente
    if: github.event_name == 'workflow_dispatch' && needs['sanity-tests'].result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Setup Maven for Windows Self-Hosted
        shell: cmd
        run: |
          echo Setting up Maven...
          setlocal enabledelayedexpansion
          set "MVN_CMD="

          REM Prioridad: ruta local confirmada por el equipo
          if exist "C:\apache-maven-3.9.9\bin\mvn.cmd" (
            set "MVN_CMD=C:\apache-maven-3.9.9\bin\mvn.cmd"
          )

          REM Fallback: resolver desde PATH del servicio del runner
          if not defined MVN_CMD (
            for %%X in (mvn.cmd) do if not "%%~$PATH:X"=="" set "MVN_CMD=%%~$PATH:X"
          )

          if not defined MVN_CMD (
            echo ERROR: Maven not found.
            echo Tried: C:\apache-maven-3.9.9\bin\mvn.cmd and PATH
            exit /b 1
          )

          echo Maven found: !MVN_CMD!
          echo MVN_CMD=!MVN_CMD!>> %GITHUB_ENV%
          call "!MVN_CMD!" -version

      - name: Setup Java 17 for Windows Self-Hosted
        shell: cmd
        run: |
          echo Setting up Java 17...

          setlocal enabledelayedexpansion
          set "JAVA17_HOME="

          REM Buscar Java 17 en ubicaciones comunes
          if exist "C:\Program Files\Java\jdk-17.0.0.1\bin\java.exe" (
            set "JAVA17_HOME=C:\Program Files\Java\jdk-17.0.0.1"
            goto found_java
          )

          if exist "C:\Program Files\Java\jdk-17\bin\java.exe" (
            set "JAVA17_HOME=C:\Program Files\Java\jdk-17"
            goto found_java
          )

          if exist "C:\Program Files\Eclipse Adoptium\jdk-17\bin\java.exe" (
            set "JAVA17_HOME=C:\Program Files\Eclipse Adoptium\jdk-17"
            goto found_java
          )

          if exist "%USERPROFILE%\.jdks\openjdk-17\bin\java.exe" (
            set "JAVA17_HOME=%USERPROFILE%\.jdks\openjdk-17"
            goto found_java
          )

          REM Buscar cualquier JDK 17 en Program Files
          for /d %%d in ("C:\Program Files\Java\jdk-17*") do (
            if exist "%%d\bin\java.exe" (
              set "JAVA17_HOME=%%d"
              goto found_java
            )
          )

          echo WARNING: Java 17 not found, using existing Java from actions/setup-java
          goto java_ready

          :found_java
          echo Java 17 found: !JAVA17_HOME!
          set "JAVA_HOME=!JAVA17_HOME!"
          set "PATH=!JAVA17_HOME!\bin;%PATH%"

          :java_ready
          java -version

      - name: Verify ADB and Appium Server
        shell: cmd
        run: |
          echo Checking ADB and Appium Server...

          setlocal enabledelayedexpansion
          set "ADB_BIN="

          REM Buscar en ANDROID_HOME
          if defined ANDROID_HOME (
            if exist "!ANDROID_HOME!\platform-tools\adb.exe" (
              set "ADB_BIN=!ANDROID_HOME!\platform-tools\adb.exe"
              goto found_adb
            )
          )

          REM Buscar en PATH
          for %%X in (adb.exe) do set "ADB_BIN=%%~$PATH:X"
          if defined ADB_BIN goto found_adb

          REM Buscar en ubicaciones comunes
          if exist "%USERPROFILE%\AppData\Local\Android\Sdk\platform-tools\adb.exe" (
            set "ADB_BIN=%USERPROFILE%\AppData\Local\Android\Sdk\platform-tools\adb.exe"
            goto found_adb
          )

          if exist "C:\Android\sdk\platform-tools\adb.exe" (
            set "ADB_BIN=C:\Android\sdk\platform-tools\adb.exe"
            goto found_adb
          )

          REM No encontrado
          echo ERROR: ADB not found in:
          echo   - ANDROID_HOME: !ANDROID_HOME!
          echo   - PATH
          echo   - %USERPROFILE%\AppData\Local\Android\Sdk\platform-tools\adb.exe
          echo   - C:\Android\sdk\platform-tools\adb.exe
          exit /b 1

          :found_adb
          echo ADB found: !ADB_BIN!
          "!ADB_BIN!" start-server
          "!ADB_BIN!" devices

          echo Checking Appium server at %APPIUM_SERVER_URL%...
          curl.exe -s %APPIUM_SERVER_URL%/status
          if errorlevel 1 (
            echo ERROR: Appium server not reachable at %APPIUM_SERVER_URL%
            exit /b 1
          )
          echo Appium server is running

      - name: Run Mobile Tests - local
        shell: cmd
        run: |
          if "%MVN_CMD%"=="" (
            echo ERROR: MVN_CMD is empty.
            exit /b 1
          )
          call "%MVN_CMD%" test -Drun.mobile.tests=true -Denv=local -Devidence.video.enabled=true -B

      - name: Upload Mobile Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-local-android
          path: |
            target/allure-results/
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 30

  # ============================================================
  # Publish Allure Report as GitHub Actions Job Summary
  # ============================================================
  publish-report:
    name: 📊 Generate & Publish Test Report
    needs: [ mobile-tests-local-android ]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch' && needs['mobile-tests-local-android'].result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Mobile Test Results
        uses: actions/download-artifact@v4
        with:
          name: mobile-test-results-local-android
          path: downloaded-results

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure HTML Report
        run: |
          RESULTS_DIR="downloaded-results/allure-results"
          if [ -d "$RESULTS_DIR" ]; then
            allure generate "$RESULTS_DIR" --clean -o allure-report
            echo "ALLURE_GENERATED=true" >> $GITHUB_ENV
            echo "✅ Allure report generated"
          else
            echo "ALLURE_GENERATED=false" >> $GITHUB_ENV
            echo "⚠️ No allure-results found in artifact"
            ls -la downloaded-results/ || true
          fi

      - name: Upload Full Allure HTML Report as Artifact
        if: env.ALLURE_GENERATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Publish Allure Report to Surge.sh
        if: env.ALLURE_GENERATED == 'true'
        shell: bash
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_DOMAIN: ${{ secrets.SURGE_DOMAIN || vars.SURGE_DOMAIN }}
        run: |
          if [ -z "$SURGE_TOKEN" ] || [ -z "$SURGE_DOMAIN" ]; then
            echo "SURGE_PUBLISHED=false" >> $GITHUB_ENV
            echo "SURGE_SKIP_REASON=Faltan SURGE_TOKEN y/o SURGE_DOMAIN (secret o variable)." >> $GITHUB_ENV
            echo "⚠️ Surge no configurado (faltan SURGE_TOKEN o SURGE_DOMAIN)."
            exit 0
          fi

          DOMAIN="$(printf '%s' "$SURGE_DOMAIN" | sed -E 's#^https?://##')"

          npm install -g surge
          surge ./allure-report "$DOMAIN" --token "$SURGE_TOKEN"

          echo "SURGE_PUBLISHED=true" >> $GITHUB_ENV
          echo "SURGE_URL=https://$DOMAIN" >> $GITHUB_ENV
          echo "SURGE_SKIP_REASON=" >> $GITHUB_ENV
          echo "✅ Reporte publicado en https://$DOMAIN"

      - name: Parse Results and Build Job Summary
        run: |
          RUN_ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
          echo "## 📊 Mobile Test Report - Self Hosted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏃 Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | $(date '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Runner | Self-Hosted Windows (local-android) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parsear resultados de surefire XML si existen
          SUREFIRE_DIR="downloaded-results/surefire-reports"
          if ls "$SUREFIRE_DIR"/*.xml 1>/dev/null 2>&1; then
            TOTAL=$(grep -h 'tests=' "$SUREFIRE_DIR"/*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | awk '{s+=$1}END{print s}')
            FAILURES=$(grep -h 'failures=' "$SUREFIRE_DIR"/*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | awk '{s+=$1}END{print s}')
            ERRORS=$(grep -h 'errors=' "$SUREFIRE_DIR"/*.xml 2>/dev/null | grep -oP 'errors="\K[0-9]+' | awk '{s+=$1}END{print s}')
            SKIPPED=$(grep -h 'skipped=' "$SUREFIRE_DIR"/*.xml 2>/dev/null | grep -oP 'skipped="\K[0-9]+' | awk '{s+=$1}END{print s}')
            TOTAL=${TOTAL:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))
            if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then STATUS="✅ PASSED"; else STATUS="❌ FAILED"; fi

            echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Tests | ✅ Passed | ❌ Failed | ⚠️ Errors | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|-----------|-----------|-----------|------------|" >> $GITHUB_STEP_SUMMARY
            echo "| $STATUS | $TOTAL | $PASSED | $FAILURES | $ERRORS | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Parsear cucumber JSON si existe
          CUCUMBER_JSON="downloaded-results/cucumber-reports/cucumber.json"
          if [ -f "$CUCUMBER_JSON" ]; then
            SCENARIOS=$(python3 -c "import json,sys; d=json.load(open('$CUCUMBER_JSON')); print(sum(len(f.get('elements',[])) for f in d))" 2>/dev/null || echo "N/A")
            PASSED_SC=$(python3 -c "import json,sys; d=json.load(open('$CUCUMBER_JSON')); print(sum(1 for f in d for e in f.get('elements',[]) if all(s.get('result',{}).get('status')=='passed' for s in e.get('steps',[]))))" 2>/dev/null || echo "N/A")
            echo "### 🥒 Cucumber Scenarios" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Total Scenarios | Passed |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| $SCENARIOS | $PASSED_SC |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📁 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **allure-html-report-run-${{ github.run_number }}**: Reporte HTML completo de Allure." >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **mobile-test-results-local-android**: Resultados raw (allure-results, cucumber, surefire)." >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 **[Abrir sección Artifacts de esta ejecución](${RUN_ARTIFACTS_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${SURGE_PUBLISHED:-false}" = "true" ]; then
            echo "### 🌐 Reporte online (gratis)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Abrir reporte Allure en Surge](${SURGE_URL})**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> El reporte se reemplaza con cada nueva ejecución manual del pipeline self-hosted." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ℹ️ URL online no disponible: ${SURGE_SKIP_REASON:-no se publicó a Surge en esta ejecución}." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "> 💡 **Para ver el reporte completo:** Puedes usar el enlace de Artifacts de arriba, descargar \`allure-html-report-run-${{ github.run_number }}\`, descomprimir y abrir \`index.html\`." >> $GITHUB_STEP_SUMMARY
