appium.server.url=https://hub.browserstack.com/wd/hub
platform.name=Android
platform.version=14.0
device.name=Google Pixel 8
automation.name=UiAutomator2

# App remota en BrowserStack (ej: bs://AppID)
# Pasado por workflow Maven como: -Dapp=bs://xxxxx
app=

# Identificadores de app para consultas de estado
# Pasados por workflow Maven como: -Dapp.package=com.xxx -Dbundle.id=com.xxx
app.package=
bundle.id=

# Timeouts y capabilities de Appium
new.command.timeout=120
implicitly.wait=10
explicit.wait=20

# BrowserStack project metadata
browserstack.project.name=appium-mobile-automation-framework
browserstack.build.name=browserstack-build
browserstack.session.name=browserstack-session

# Defaults de CI: se usan cuando GitHub vars no envian override
browserstack.android.device.name=Google Pixel 8
browserstack.android.platform.version=14.0
browserstack.ios.device.name=iPhone 16 Pro
browserstack.ios.platform.version=18

# BrowserStack recording & logging
browserstack.debug=true
browserstack.networkLogs=true
browserstack.appiumLogs=true
browserstack.video=true
browserstack.deviceLogs=true
browserstack.idleTimeout=300

